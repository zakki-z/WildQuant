services:

  # Postgres — shared database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file: .env                
    expose:
      - "5432"                          
    networks:
      - wildquants-net
    volumes:
      - postgres-data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Agent Service — Python / FastAPI
  agent-service:
    build:
      context: .                          
      dockerfile: infra/python/dockerfile
    image: wildquants/agent-service:latest
    container_name: agent-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"                           
    networks:
      - wildquants-net
    depends_on:
      postgres:
        condition: service_healthy     
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s              

  # Gateway Service — Java / Spring Boot
  gateway-service:
    build:
      context: .
      dockerfile: infra/java/dockerfile
    image: wildquants/gateway-service:latest
    container_name: gateway-service
    restart: unless-stopped
    env_file: .env
    environment:
      - AGENT_SERVICE_URL=http://agent-service:8000  
    expose:
      - "8080"
    networks:
      - wildquants-net
    depends_on:
      postgres:
        condition: service_healthy      
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL",
             "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend — Node.js / Next.js
  frontend:
    build:
      context: .
      dockerfile: infra/node/dockerfile
    image: wildquants/frontend:latest
    container_name: frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://gateway-service:8080  # server-side calls (SSR)
    ports:
      - "3000:3000"                       # only the frontend is exposed to the host
    networks:
      - wildquants-net
    depends_on:
      gateway-service:
        condition: service_healthy        # wait until gateway passes healthcheck

# Services communicate by name (e.g. http://agent-service:8000)
# Nothing is reachable from outside except port 3000 on the frontend
networks:
  wildquants-net:
    driver: bridge

volumes:
  postgres-data: